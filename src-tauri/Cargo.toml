[package]
name = "stratamonitor"
version = "0.1.0"
description = "A compact desktop HUD for a Strata install's /metrics monitor."
authors = ["StrataMonitor"]
edition = "2021"

[lib]
name = "stratamonitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "^2", features = [] }
tauri-plugin-window-state = "^2"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
reqwest = { version = "^0.13", features = ["blocking", "rustls"] }
